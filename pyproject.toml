[project]
name = "bible-study"
version = "0.0.1"
description = "Gavin's personal Bible study tool — Matthew, sentence-aligned."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.27,<0.28",
    "anthropic>=0.39,<1",
    "sse-starlette>=2.1,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "anyio>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
